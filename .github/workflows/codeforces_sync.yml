name: Codeforces Auto-Sync

on:
  schedule:
    - cron: "*/30 * * * *"   # every 30 min (GitHub minimum is ~5 min, but 15 is spammy)
  workflow_dispatch:          # allow manual trigger from Actions tab

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v3
        with:
          token: ${{ secrets.GH_TOKEN }}
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install requests

      - name: Run sync script
        env:
          CF_HANDLE:   "Lyraen"
          CF_PASSWORD: ${{ secrets.CF_PASSWORD }}   # ← NEW: add this secret
          GH_TOKEN:    ${{ secrets.GH_TOKEN }}
          GH_REPO:     ${{ github.repository }}
        run: python sync.py

      - name: Commit and push changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git remote set-url origin https://x-access-token:${{ secrets.GH_TOKEN }}@github.com/${{ github.repository }}
          git add .
          git diff --staged --quiet && echo "No changes to commit" || git commit -m "🤖 Auto-sync Codeforces submissions"
          git push
